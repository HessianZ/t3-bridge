name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test -mod=readonly ./...

  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }} (${{ matrix.flavor }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, flavor: core}
          - {runner: ubuntu-24.04, goos: linux, goarch: arm64, flavor: core}
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, flavor: desktop}
          - {runner: macos-15, goos: darwin, goarch: arm64, flavor: desktop}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, flavor: desktop}
          - {runner: ubuntu-24.04, goos: windows, goarch: amd64, flavor: desktop}
    env:
      PACKAGE: bin/t3-bridge-${{ matrix.goos }}-${{ matrix.goarch }}-${{ matrix.flavor }}.zip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Linux desktop dependencies
        if: matrix.goos == 'linux' && matrix.flavor == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build and check ZIP
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          FLAVOR: ${{ matrix.flavor }}
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) version="$GITHUB_REF_NAME" ;;
            *) version="dev-${GITHUB_SHA:0:12}" ;;
          esac
          sh deploy/build-release.sh "$version" "$PACKAGE" "$FLAVOR"
          unzip -tq "$PACKAGE"
      - name: Upload ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.PACKAGE }}
          archive: false
          if-no-files-found: error
